project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.rmd"
    - "*.ipynb"
    - "!01a_manuscript_original.rmd"
    - "!05c_analyses_revision.qmd"
  resources:
    - codebook/*.pdf

lang: en

website:
  title: "Like Dislike"
  bread-crumbs: false
  repo-url: https://github.com/xc6pswfyxh/like_dislike
  repo-actions: [edit, source, issue]
  page-navigation: true
  back-to-top-navigation: true
  page-footer: 
    center: "© 2026, The Authors" 

  sidebar:
    style: "floating"
    search: true
    collapse-level: 1
    tools:
      - icon: github
        href: https://github.com/xc6pswfyxh/like_dislike
    contents:
      - href: index.qmd
        text: "Home"
      - href: 01b_manuscript_rev.qmd
        text: "Manuscript"
      - href: 05a_analyses.qmd
        text: "Analyses"
      - section: "Content Analysis"
        contents:
          - appendix_classification_procedure.qmd
          - appendix_codebook.qmd
          - 03_coding_manual_icr.qmd
          - 04a_pretrained_classification.ipynb
          - 04b_llm_classification.ipynb
          - appendix_model_comparison.qmd
          - appendix_system_prompt.qmd
          - 04c_final_classification.ipynb
      - href: 05b_analyses_additional.qmd
        text: "Additional Analyses"
      - section: "Materials"
        contents:
          - href: appendix_website.rmd
            text: "Website Interface"
          - href: 02_items.rmd
            text: "Items"
      - href: appendix_prereg_note.qmd
        text: "Open Science and Preregistration"

format:
  html:
    embed-resources: true
    theme:
      light: cosmo
      dark: cyborg
    css: styles.css
    toc: true
    grid:
      margin-width: 300px
      body-width: 800px
      gutter-width: 100px
      
knitr:
  opts_chunk:
    fig.path: "assets/figures/"
    cache.path: "assets/cache/"