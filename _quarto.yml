project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.rmd"
    - "*.ipynb"
    - "!05a_analyses.qmd"

lang: en

website:
  title: "Like Dislike"
  bread-crumbs: false
  repo-url: https://github.com/xc6pswfyxh/like_dislike
  repo-actions: [edit, source, issue]
  page-navigation: true
  back-to-top-navigation: true
  page-footer: 
    center: "© 2026, The Authors" 
    #right: "<img src='images/logo_inst.png' height='30px'>"
    #left: "<img src='images/logo_dept.png' height='50px'>"

  navbar:
    collapse: true
    left:
      - href: index.qmd
        text: "Home"
      - href: 01b_manuscript_rev.qmd
        text: "Manuscript Revised"
      - href: 01a_manuscript_original.rmd
        text: "First Submission"
      - href: 08_preregistration_changes.rmd
        text: "Preregistration"

    tools:
      #- icon: bluesky
      #  href: https://bsky.app/

      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/xc6pswfyxh/like_dislike

  sidebar:
    - title: "Home"
      style: "floating"
      search: true
      contents:
        - href: index.qmd
          text: "Overview"
        - href: 00_website.rmd
          text: "Website"

    - title: "Manuscript Revised"
      style: "floating"
      search: true
      contents:
        - href: 01b_manuscript_rev.qmd
          text: "Likes or Dislikes, Gratifications or Concerns?"
        - text: "---"
        - section: "Supplementary Material"
          contents:
            - 02_items.rmd
            - 03_coding_manual_icr.qmd
            - 04a_pretrained_classification.ipynb
            - 04b_llm_classification.ipynb
            - 04c_final_classification.ipynb
            - 05a_analyses.qmd
            - 05b_analyses_additional.qmd
            - 05c_analyses_revision.qmd
            - appendix_prereg_note.qmd
            - appendix_codebook.qmd
            - appendix_system_prompt.qmd
            - appendix_model_comparison.qmd

    - title: "First Submission"
      style: "floating"
      search: true
      contents:
        - href: 01a_manuscript_original.rmd
          text: "Main Text"
        - text: "---"
        - section: "Supplementary Material"
          contents:
            - 02_items.rmd
            - 05a_analyses.qmd
            - 05b_analyses_additional.qmd

    - title: "Preregistration"
      style: "floating"
      search: true
      contents:
        - href: 08_preregistration_changes.rmd
          text: "Changes from Preregistration"


format:
  html:
    embed-resources: true
    theme:
      light: cosmo
      dark: cyborg
    css: styles.css
    toc: true

    grid:
      margin-width: 300px
      body-width: 800px
      gutter-width: 100px
      
knitr:
  opts_chunk:
    fig.path: "assets/figures/"
    cache.path: "assets/cache/"